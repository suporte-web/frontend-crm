# Exemplo: publique o conteúdo de dist/ em /usr/share/nginx/html.
# Ajuste o upstream se a API estiver em outro servidor ou container.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Mantém o limite anterior para lotes de anexos. Ajuste junto aos limites da API.
    client_max_body_size 401m;

    location /api/ {
        # A barra final remove /api/ ao encaminhar ao NestJS atual, sem prefixo global.
        # Se o NestJS usar /api, altere para http://127.0.0.1:3001/api/.
        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_request_buffering off;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:3001/uploads/;
        proxy_set_header Host $host;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /version.json {
        default_type application/json;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # Permite abrir e atualizar diretamente URLs como /clientes/123.
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
